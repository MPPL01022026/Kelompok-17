  <text x="600" y="86" text-anchor="middle" fill="#A8A29E" font-family="'Segoe UI', sans-serif" font-size="13">4</text>
  <text x="600" y="125" text-anchor="middle" fill="#A8A29E" font-family="'Segoe UI', sans-serif" font-size="12">Desain</text>
  <!-- Stage 5 -->
