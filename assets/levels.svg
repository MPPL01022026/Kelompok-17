  <text x="1080" y="86" text-anchor="middle" fill="#A8A29E" font-family="'Segoe UI', sans-serif" font-size="13">7</text>
  <text x="1080" y="125" text-anchor="middle" fill="#A8A29E" font-family="'Segoe UI', sans-serif" font-size="12">Rilis</text>
