  </defs>
  <rect width="1200" height="160" rx="16" fill="#1C1917"/>
  <line x1="120" y1="80" x2="1080" y2="80" stroke="#44403C" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="120" y1="80" x2="440" y2="80" stroke="url(#road-grad)" stroke-width="4"/>
  <!-- Stage 1 -->
  <circle cx="120" cy="80" r="24" fill="#EA580C"/>
  <text x="120" y="86" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">1</text>
  <text x="120" y="125" text-anchor="middle" fill="#FDBA74" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Inisiasi ✅</text>
  <!-- Stage 2 -->
  <circle cx="280" cy="80" r="24" fill="#EA580C"/>
