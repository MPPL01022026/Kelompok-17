services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ayamo-app:latest
    container_name: ayamo-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-Ayamo - Eat, Chill, Repeat}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      APP_LOCALE: "${APP_LOCALE:-id}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-id}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-ayamo_db}"
      DB_USERNAME: "${DB_USERNAME:-ayamo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-ayamo_secret}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-adminayamo}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      AUTORUN_MIGRATIONS: "${AUTORUN_MIGRATIONS:-true}"
      AUTORUN_SEED: "${AUTORUN_SEED:-false}"
    volumes:
      - ayamo-storage:/var/www/html/storage/app/public
      - ayamo-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ayamo-net

  mysql:
    image: mysql:8.4
    container_name: ayamo-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ayamo_db}"
      MYSQL_USER: "${DB_USERNAME:-ayamo_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-ayamo_secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-ayamo_root_secret}"
    volumes:
      - ayamo-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ayamo-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ayamo-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ayamo-net

volumes:
  ayamo-mysql:
  ayamo-storage:
  ayamo-logs:

networks:
  ayamo-net:
    driver: bridge
